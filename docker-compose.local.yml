services:
  helmlock:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: helmlock:local
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      LOCAL_MODE: "true"
      LOCAL_DB_PATH: /app/data/helmlock.sqlite3
      MOCK_NFC_UID: ${MOCK_NFC_UID:-DEMO-NFC-001}
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
